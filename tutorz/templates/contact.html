<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - Tutorz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #333;
            color: #f4f4f4;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #444;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #B22222;
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input[type="text"],
        input[type="email"],
        textarea,
        button {
            margin-bottom: 15px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #555;
            background-color: #555;
            color: #f4f4f4;
        }
        textarea {
            height: 100px;
        }
        button {
            background-color: #B22222;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #8B0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact Us</h1>
        <form method="post" action="/contact">
            <input type="text" name="name" placeholder="Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <textarea name="message" placeholder="Message" required></textarea>
            <button type="submit">Send</button>
            {% if error %}
            <p style="color:red;">{{ error }}</p>
            {% endif %}
            {% if success %}
            <p style="color:green;">{{ success }}</p>
            {% endif %}
        </form>
        <footer>
        <p>&copy; {{ current_year }} Tutorz. All rights reserved.</p>
    </footer>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Plans - Tutorz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #333;
            color: #f4f4f4;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #444;
            padding: 20px;
            border: 1px solid #555;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #B22222;
            text-align: center;
        }
        .plan {
            margin-bottom: 20px;
        }
        .plan h2 {
            color: #B22222;
        }
        .plan p {
            line-height: 1.6;
        }
        .plan button {
            background-color: #B22222;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }
        .plan button:hover {
            background-color: #8B0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Payment Plans</h1>
        <div class="plan">
            <h2>Basic Plan</h2>
            <p>Our basic plan includes 4 tutoring sessions per month.</p>
            <button>Sign Up</button>
        </div>
        <div class="plan">
            <h2>Standard Plan</h2>
            <p>Our standard plan includes 8 tutoring sessions per month.</p>
            <button>Sign Up</button>
        </div>
        <div class="plan">
            <h2>Premium Plan</h2>
            <p>Our premium plan includes unlimited tutoring sessions per month.</p>
            <button>Sign Up</button>
        </div>
        <footer>
        <p>&copy; {{ current_year }} Tutorz. All rights reserved.</p>
    </footer>
    </div>
</body>
</html>

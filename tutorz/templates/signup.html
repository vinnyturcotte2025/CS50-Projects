<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Tutorz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #333;
            color: #f4f4f4;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #444;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #B22222;
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        button {
            margin-bottom: 15px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #555;
            background-color: #555;
            color: #f4f4f4;
        }
        button {
            background-color: #B22222;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #8B0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sign Up</h1>
        <form action="{{ url_for('signup') }}" method="POST">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="eula">
        <input type="checkbox" id="eula" name="eula"> I accept the EULA
    </label>

    <button type="submit">Sign Up</button>
</form>
    </div>
    <footer>
        <p>&copy; {{ current_year }} Tutorz. All rights reserved.</p>
    </footer>
</body>
</html>

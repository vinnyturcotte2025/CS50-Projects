<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        header {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }
        nav a {
            margin: 0 10px;
            color: #f00;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
        }
        button {
            background-color: #f00;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }
        button:hover {
            background-color: #c00;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 300px;
        }
        label, input {
            margin-bottom: 10px;
            width: 100%;
        }
        section {
            margin-bottom: 20px;
        }
        footer {
            margin-top: 20px;
            width: 100%;
            background-color: #333;
            padding: 10px 0;
            color: #fff;
        }
    </style>
</head>
<body>
    <header>
        <h1>Tutorz</h1>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('services') }}">Services</a>
             <a href="{{ url_for('payment_plans') }}">Payment Plans</a>
            <a href="{{ url_for('contact') }}">Contact</a>
            <a href="{{ url_for('testimonials') }}">Testimonials</a>
            {% if session.get('user_id') %}
                <a href="{{ url_for('profile') }}">Profile</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('login') }}">Login</a>
                <a href="{{ url_for('signup') }}">Sign Up</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>&copy; {{ current_year }} Tutorz. All rights reserved.</p>
    </footer>

    <!-- Script to set current year -->
    <script>
        var currentYear = new Date().getFullYear();
        document.getElementById("current-year").innerHTML = currentYear;
    </script>
</body>
</html>
